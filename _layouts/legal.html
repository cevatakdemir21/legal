<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ page.app_name }}</title>
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<main>

<a class="backlink" href="{{ '/' | relative_url }}">← All apps</a>

<h1>{{ page.title }}</h1>
<p class="subtitle">
  <span class="app-name">{{ page.app_name }}</span> · Effective {{ page.effective | date: "%-d %B %Y" }}
</p>

{{ content }}

<footer>
  <p>
    {{ page.app_name }} is made by {{ site.developer_name }}.
    Questions about this page: <a href="mailto:{{ site.support_email }}">{{ site.support_email }}</a>
  </p>
</footer>

</main>
</body>
</html>
